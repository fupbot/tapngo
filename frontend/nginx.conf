# Simplest possible routing, per ARCHITECTURE_DECISIONS.md: static SPA at
# "/", reverse-proxy "/api/*" to the backend service (Docker Compose's
# internal DNS resolves "backend" to that container).
server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        # React Router client-side routes (e.g. /menu/drinks) have no
        # matching static file — fall back to index.html for all of them.
        try_files $uri /index.html;
    }
}
