services:
  backend:
    build: ./backend
    environment:
      # Persistent volume below, not the image's own filesystem — a
      # container recreation must not wipe stock levels / order history.
      DATABASE_URL: sqlite:////app/data/tapngo.db
    volumes:
      - backend_data:/app/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    ports:
      # 80 by default, so `docker compose up --build` still needs zero
      # config for the common case — but overridable in one env var if
      # something else already owns port 80 on the host, e.g.:
      #   FRONTEND_PORT=8080 docker compose up --build
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  backend_data:
